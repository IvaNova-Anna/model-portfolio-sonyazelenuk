[build]
  command = "node build-photos.js"
  publish = "."

[[redirects]]
  from = "/spec.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-photos.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
